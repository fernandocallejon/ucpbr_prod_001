name: RetailNexus CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  AZURE_FUNCTIONAPP_NAME: 'retailnexus-dev-api'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: 'apps/api'

jobs:
  # ─── Build & Test ───
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build API
        run: npm run build:api

      - name: Run tests
        run: npm test

  # ─── Deploy API to Azure Functions ───
  deploy-api:
    name: Deploy API
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build:shared

      - name: Build API
        run: npm run build:api

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  # ─── Deploy Frontend to Azure Static Web Apps ───
  deploy-web:
    name: Deploy Frontend
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build -w apps/web
        env:
          VITE_API_URL: https://retailnexus-dev-api.azurewebsites.net

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'apps/web'
          output_location: 'dist'
          skip_api_build: true

  # ─── Deploy Infrastructure ───
  deploy-infra:
    name: Deploy Infrastructure
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Bicep
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: retailnexus-dev-rg
          template: infra/main.bicep
          parameters: >
            infra/main.bicepparam
            jwtSecret=${{ secrets.JWT_SECRET }}
            api2cartApiKey=${{ secrets.API2CART_API_KEY }}
            serperApiKey=${{ secrets.SERPER_API_KEY }}
            stripeSecretKey=${{ secrets.STRIPE_SECRET_KEY }}
            stripeWebhookSecret=${{ secrets.STRIPE_WEBHOOK_SECRET }}
